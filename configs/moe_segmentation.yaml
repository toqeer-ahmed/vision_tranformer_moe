model:
  name: "nvidia/mit-b0"
  pretrained: true
  num_classes: 2
  img_size: 352
  moe:
    num_experts: 4
    top_k: 2
    capacity_factor: 1.2
    noisy_gating: true
    balance_loss_coef: 0.01

dataset:
  name: "medical-image-mask"
  data_dir: "data/medical_dataset"
  batch_size: 2
  num_workers: 2

training:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 40
  early_stopping_patience: 10
  seed: 42
  device: "cuda"
  fast_dev_run: false
  loss_type: "focal_tversky"
  dice_weight: 1.0
  use_cosine_scheduler: true
  min_lr: 1.0e-6

logging:
  log_dir: "outputs/moe_segmentation/logs"
  checkpoint_dir: "outputs/moe_segmentation/checkpoints"
  plot_dir: "outputs/moe_segmentation/plots"
  use_tensorboard: true
