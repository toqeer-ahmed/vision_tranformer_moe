model:
  backbone: "microsoft/swin-tiny-patch4-window7-224"
  num_classes: 3

training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.05
  early_stopping_patience: 10
  seed: 42
  img_size: 224

moe:
  num_experts: 4
  top_k: 2
  capacity_factor: 1.2
  noisy_gating: True
  balance_loss_coef: 0.01
  warm_init: False
